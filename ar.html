
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlantAR - Augmented Reality</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6ed;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 10;
    background: #315c40;
    color: white;
    padding: 15px;
    text-align: center;
    box-sizing: border-box;
}

.info {
    position: fixed;
    bottom: 20px;
    left: 5%;
    width: 90%;
    background: rgba(255,255,255,0.95);
    border-radius: 15px;
    padding: 15px;
    box-sizing: border-box;
    z-index: 10;
    text-align: center;
    color: #315c40;
}

.info h2 {
    margin: 5px;
}

.info p {
    margin: 8px;
    font-size: 14px;
}

a {
    color: #315c40;
}
</style>
</head>

<body>

<header>
    <h2>🌿 PlantAR Experience</h2>
    <p>Point your camera at the Hiro marker</p>
</header>

<a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false">

    <a-marker preset="hiro">

        <!-- Plant pot -->
        <a-cylinder
            position="0 0.25 0"
            radius="0.35"
            height="0.5"
            color="#b8754b">
        </a-cylinder>

        <!-- Plant stem -->
        <a-cylinder
            position="0 0.9 0"
            radius="0.04"
            height="1"
            color="#426b3e">
        </a-cylinder>

        <!-- Leaves -->
        <a-sphere
            position="-0.35 1.15 0"
            scale="0.35 0.18 0.12"
            color="#76a85c"
            rotation="0 0 -25">
        </a-sphere>

        <a-sphere
            position="0.35 1.4 0"
            scale="0.35 0.18 0.12"
            color="#5e9149"
            rotation="0 0 25">
        </a-sphere>

        <a-sphere
            position="0 1.65 0"
            scale="0.3 0.4 0.15"
            color="#8ab86c">
        </a-sphere>

        <!-- Floating plant label -->
        <a-text
            value="PlantAR"
            position="0 2.2 0"
            align="center"
            color="#315c40"
            scale="1.5 1.5 1.5">
        </a-text>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<div class="info">
    <h2>🌱 Plant Information</h2>
    <p><strong>Plant:</strong> Green Indoor Plant</p>
    <p>💧 Moderate Water</p>
    <p>☀️ Indirect Sunlight</p>
    <p>🌿 A simple interactive AR experience</p>
</div>

</body>
</html>
