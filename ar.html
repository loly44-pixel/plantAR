
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlantAR Experience</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f7ef;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    background: #315c40;
    color: white;
    text-align: center;
    padding: 15px;
    z-index: 10;
    box-sizing: border-box;
}

.info {
    position: fixed;
    bottom: 20px;
    left: 5%;
    width: 90%;
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-sizing: border-box;
    text-align: center;
    z-index: 10;
    box-shadow: 0 5px 20px #0002;
}

.info h2 {
    color: #315c40;
    margin: 5px;
}

.info p {
    color: #718071;
    font-size: 14px;
    margin: 8px;
}

</style>
</head>

<body>

<header>
    <h2>🌿 PlantAR</h2>
    <p>Point your camera at the plant image</p>
</header>

<a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

        <!-- Information card appears on the plant image -->

        <a-plane
            position="0 0.35 0"
            width="1"
            height="0.65"
            color="#ffffff"
            opacity="0.95">
        </a-plane>

        <a-text
            value="PLANTAR"
            position="0 0.55 0.01"
            align="center"
            color="#315c40"
            width="1.8">
        </a-text>

        <a-text
            value="Green Plant"
            position="0 0.35 0.01"
            align="center"
            color="#426b4b"
            width="1.5">
        </a-text>

        <a-text
            value="Water: Moderate"
            position="0 0.15 0.01"
            align="center"
            color="#526957"
            width="1.2">
        </a-text>

        <a-text
            value="Sunlight: Indirect"
            position="0 -0.02 0.01"
            align="center"
            color="#526957"
            width="1.2">
        </a-text>

    </a-entity>

</a-scene>

<div class="info">

    <h2>🌱 Plant Information</h2>

    <p>
        Discover plant details through
        Augmented Reality.
    </p>

    <p>
        💧 Moderate Water |
        ☀️ Indirect Sunlight
    </p>

</div>

</body>
</html>
